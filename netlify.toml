[build]
  # Sem "base": o Netlify instala as dependências da raiz (onde ficam
  # express/cors/dotenv/serverless-http/@supabase, usadas pela função) e
  # depois o "command" instala e builda o client separadamente.
  command = "npm install --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "server/functions"

[build.environment]
  # SUPABASE_URL/VITE_SUPABASE_URL não são segredo (é só o endereço público
  # do projeto, o mesmo que já fica exposto no JS do navegador) -- sem isso
  # o scanner de segredos do Netlify falha o build por "coincidência" com o
  # valor que aparece em arquivos de exemplo do repositório.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# A API precisa vir ANTES do catch-all do SPA, senão /api/* cairia no index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
