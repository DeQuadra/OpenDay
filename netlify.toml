[build]
  # Sem "base": o Netlify instala as dependências da raiz (onde ficam
  # express/cors/dotenv/serverless-http/@supabase, usadas pela função) e
  # depois o "command" instala e builda o client separadamente.
  command = "npm install --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "server/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# A API precisa vir ANTES do catch-all do SPA, senão /api/* cairia no index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
